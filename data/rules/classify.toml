# Classification rules: what is an "application".
# Glob patterns support `*`. User additions go to ~/.config/appreestr/rules.toml (same keys).

# Packages always treated as applications.
app_packages = []

# Packages never shown as applications, even when they ship a visible launcher.
system_packages = []

# Launchers (desktop file IDs) that are developer or system tools rather than programs people
# recognise. A package whose only visible launchers match is not an application.
system_desktop_ids = [
  "avahi-discover.desktop",
  "bssh.desktop",
  "bvnc.desktop",
  "lstopo.desktop",
  "qv4l2.desktop",
  "qvidcap.desktop",
  "jconsole*.desktop",
  "jshell*.desktop",
  "java-*.desktop",
  "cups.desktop",
  "xgps.desktop",
  "xgpsspeed.desktop",
  "org.freedesktop.IBus.Setup.desktop",
  "electron*.desktop",
  "userapp-*.desktop",
]

# Packages without launchers that are never "console utilities" (system plumbing), even when
# the user installed them by name.
system_name_patterns = [
  "lib*", "lib32-*", "*-firmware", "linux-firmware*", "*-headers", "*-dkms", "*-ucode",
  "ttf-*", "otf-*", "*-fonts", "*-fonts-*", "noto-fonts*", "adobe-source-*",
  "*-docs", "*-doc", "*-keyring", "*-mirrorlist", "*-hooks", "*-settings",
  "plymouth*", "grub*", "*-plymouth-*", "systemd*", "*-meta",
]

# Ecosystem prefixes that usually mean a library or a driver. They count as system plumbing only
# when the user did not install the package on purpose: `pacman -S python-pip` or
# `pacman -S nvidia-container-toolkit` is a tool the user wants, `python-requests` is not.
system_name_patterns_weak = [
  "python-*", "python2-*", "perl-*", "ruby-*", "haskell-*", "lua-*", "lua5*-*", "ocaml-*",
  "mesa*", "vulkan-*", "nvidia*", "opencl-*", "xf86-*", "xorg-server*", "pipewire*",
  "wireplumber", "gst-*", "qt5-*", "qt6-*", "kf5-*", "kf6-*",
]

# Package groups whose members are base system, never console utilities.
system_groups = ["base", "base-devel"]
