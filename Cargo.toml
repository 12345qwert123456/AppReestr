[workspace]
resolver = "3"
members = ["crates/core", "crates/helper", "crates/app", "crates/dump"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/12345qwert123456/AppReestr"
homepage = "https://github.com/12345qwert123456/AppReestr"

[workspace.dependencies]
appreestr-core = { path = "crates/core" }
alpm = "5"
alpm-utils = "5"
pacmanconf = "3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
postcard = { version = "1", features = ["use-std"] }
quick-xml = "0.38"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backhand = { version = "0.25", default-features = false, features = ["xz", "gzip", "zstd"] }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_48"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "user"] }
notify = "8"
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
