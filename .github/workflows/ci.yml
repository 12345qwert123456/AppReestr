name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rust gtk4 libadwaita gettext desktop-file-utils appstream git
      - uses: actions/checkout@v7
      - name: Format, lint, test, validate data files
        run: make check
      - name: Release build
        run: make build
